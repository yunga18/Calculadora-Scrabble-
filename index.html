<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#234d3d">
<title>Scrabble · Cuenta cada jugada</title>
<meta name="description" content="Tu marcador de Scrabble: organiza los turnos, suma cada jugada y descubre al ganador.">
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#233a30;background:#f6f3eb;font-synthesis:none;--green:#234d3d;--muted:#6a746c;--line:#dedfd3}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:11px 17px;background:#fffef9;color:var(--green);font-weight:650}button:hover{filter:brightness(.96)}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid #d39838;outline-offset:3px}.primary{background:var(--green);color:white;border-color:var(--green)}.quiet{background:transparent}.danger{color:#934332}input{width:100%;min-width:0;padding:13px;border:1px solid #cbcfc3;background:#fffefb;border-radius:11px;color:#233a30}header{max-width:1120px;margin:auto;padding:24px 24px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:12px}.brand{display:flex;align-items:center;gap:12px;font-weight:750;letter-spacing:-.4px}.tile{background:#e9d9ad;box-shadow:0 3px 0 #c5b286;border:1px solid #c7b789;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;width:43px;height:44px;font:700 27px Georgia;position:relative}.tile sub{font:11px system-ui;position:absolute;bottom:4px;right:5px}.tag,.eyebrow{font-size:11px;font-weight:750;letter-spacing:1.8px;text-transform:uppercase}.tag{color:var(--muted);letter-spacing:1px}.container{max-width:1060px;margin:40px auto;padding:0 24px 50px}h1{font-family:Georgia,serif;font-size:clamp(34px,5vw,52px);font-weight:500;letter-spacing:-1.5px;margin:12px 0}h2{font-size:22px;letter-spacing:-.6px;margin:0 0 10px}p{color:var(--muted);line-height:1.65}.intro{margin-bottom:30px}.eyebrow{color:#887443}.panel{background:#fffef9;border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 5px 15px #243a3010}.setup{max-width:630px;margin:auto}.steps{display:flex;gap:12px;margin:26px 0;color:var(--muted);font-size:13px}.steps .active{color:var(--green);font-weight:750}.person{display:flex;align-items:center;gap:9px;margin:12px 0}.number{flex:0 0 30px;color:#887443;font:italic 22px Georgia}.person input{flex:1}.person .name{flex:1;overflow-wrap:anywhere;font-weight:650}.icon{padding:8px 13px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.actions>*{flex:1}.help{font-size:13px;margin:14px 0 0}.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;align-items:start}.scoreboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:24px 0}.scorecard{border:1px solid var(--line);border-radius:17px;background:#eeeee4;padding:18px;position:relative}.scorecard.current{background:#e1eadc;border-color:#789a75}.scorecard .player{font-weight:650;overflow-wrap:anywhere}.points{font:500 40px Georgia;margin-top:8px}.points small{font:12px system-ui;color:var(--muted);margin-left:6px}.turn{background:var(--green);color:white}.turn p{color:#cfdbd2}.turn h2{font-family:Georgia;font-size:32px;overflow-wrap:anywhere}.turn label{display:block;font-size:13px;margin-bottom:9px;color:#e0e8df}.entry{display:flex;gap:10px}.entry input{font-size:29px;min-width:0}.turn .primary{background:#eed6a1;color:#2c4436;border-color:#eed6a1}.turn .quiet{color:white;border-color:#678372}.pill{display:inline-block;background:#f2dfb0;color:#5c461c;font-size:12px;padding:7px 11px;border-radius:30px;margin-bottom:16px}.tablewrap{overflow:auto;margin-top:20px}table{width:100%;border-collapse:collapse;text-align:right;font-size:14px}th,td{padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th:first-child,td:first-child{text-align:left}th{font-size:12px;color:var(--muted)}td button{border:0;background:transparent;min-height:38px;padding:5px 12px;text-decoration:underline;text-decoration-color:#bbbfae;text-underline-offset:4px}.empty{padding:30px 10px;text-align:center;font-size:14px}.deduction{display:grid;grid-template-columns:1fr 100px;gap:14px;align-items:center;margin:17px 0}.deduction label{overflow-wrap:anywhere}.deduction small{display:block;color:var(--muted);margin-top:4px}.winner{text-align:center;padding:36px 20px;background:#e3ebdd;border-radius:20px;margin-bottom:22px}.winner h1{overflow-wrap:anywhere}.medal{font-size:42px}.rank{display:flex;align-items:center;gap:14px;padding:17px 0;border-bottom:1px solid var(--line)}.rank .name{flex:1;overflow-wrap:anywhere}.rank strong{font:30px Georgia}.rank small{display:block;color:var(--muted);margin-top:5px}footer{text-align:center;font-size:12px;color:var(--muted);padding:18px}.error{color:#a43725}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}.topline h1{margin-bottom:0}dialog{border:1px solid var(--line);border-radius:20px;padding:26px;max-width:420px;width:calc(100% - 32px);color:#233a30;background:#fffef9}dialog::backdrop{background:#112d2377}dialog label{display:block;margin:18px 0 8px}#notice{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#233a30;color:white;border-radius:12px;padding:12px 20px;width:max-content;max-width:90%;z-index:5}#notice:empty{display:none}@media(max-width:700px){header{padding:18px}.container{padding:0 16px 30px;margin-top:27px}.grid{grid-template-columns:1fr}.panel{padding:21px}.tag{font-size:9px;max-width:95px;text-align:right}.scoreboard{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.scorecard{padding:14px}.points{font-size:33px}.entry{flex-wrap:wrap}.entry input{flex:1;min-width:100px}.entry button{flex:1;white-space:nowrap}.topline{align-items:flex-start}.topline>button{font-size:12px;padding:9px}.actions{gap:8px}.actions button{font-size:14px}}
</style>
</head>
<body><header><div class="brand"><span class="tile" aria-hidden="true">S<sub>1</sub></span> Scrabble <span style="font-weight:400;color:#7a8375">/ marcador</span></div><span class="tag">Cuenta cada jugada</span></header><main id="app" class="container"></main><footer>Hecho para compartir la mesa. La partida se guarda en este navegador.</footer><div id="notice" role="status" aria-live="polite"></div><dialog id="editDialog"><form id="editForm"><h2>Corregir jugada</h2><p id="editName"></p><label for="editPoints">Puntos</label><input id="editPoints" type="number" min="0" max="9999" step="1" required><div class="actions"><button type="button" id="cancelEdit">Cancelar</button><button class="primary">Guardar</button></div></form></dialog>
<script>
'use strict';
const KEY='scrabble-marcador-v1';
const fresh=()=>({version:1,phase:'names',players:['',''],scores:[],finalRound:null,deductions:[]});
let state=fresh(),editIndex=null;
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.version===1&&['names','order','play','deduct','result'].includes(saved.phase)&&Array.isArray(saved.players)&&saved.players.length>=2&&saved.players.length<=8&&saved.players.every(n=>typeof n==='string')&&Array.isArray(saved.scores)&&saved.scores.every(n=>Number.isInteger(n)&&n>=0&&n<=9999)&&Array.isArray(saved.deductions)&&saved.deductions.every(n=>Number.isInteger(n)&&n>=0&&n<=9999)&&(saved.finalRound===null||Number.isInteger(saved.finalRound)&&saved.finalRound>0))state=saved;}catch{}
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const total=i=>state.scores.reduce((sum,v,j)=>sum+(j%state.players.length===i?v:0),0);
const round=()=>Math.floor(state.scores.length/state.players.length)+1;
const current=()=>state.scores.length%state.players.length;
function notice(msg){document.getElementById('notice').textContent=msg;clearTimeout(notice.timer);notice.timer=setTimeout(()=>document.getElementById('notice').textContent='',4000)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{notice('No se pudo guardar. Mantén esta pestaña abierta para conservar la partida.')}}
function update(){save();render()}
function history(){if(!state.scores.length)return '<p class="empty">El tablero está listo.<br>Tu primera jugada comienza la historia.</p>';let html='<div class="tablewrap"><table><thead><tr><th>Ronda</th>'+state.players.map(n=>'<th>'+esc(n)+'</th>').join('')+'</tr></thead><tbody>';for(let r=0;r<Math.ceil(state.scores.length/state.players.length);r++){html+='<tr><td>'+String(r+1)+(r+1===state.finalRound?' · final':'')+'</td>';state.players.forEach((_,i)=>{const j=r*state.players.length+i;html+='<td>'+(j<state.scores.length?(state.phase==='result'?state.scores[j]:'<button data-edit="'+j+'" aria-label="Corregir puntos de '+esc(state.players[i])+' en ronda '+(r+1)+'">'+state.scores[j]+'</button>'):'—')+'</td>'});html+='</tr>'}return html+'</tbody></table></div>'}
function render(){
if(state.phase==='names'||state.phase==='order'){const order=state.phase==='order';app.innerHTML='<div class="setup"><div class="intro"><span class="eyebrow">Una mesa. Muchas buenas palabras.</span><h1>Que empiece la partida.</h1><p>Ustedes ponen las palabras.<br>Nosotros llevamos la cuenta.</p></div><div class="steps"><span class="'+(!order?'active':'')+'">01 · Jugadores</span><span>→</span><span class="'+(order?'active':'')+'">02 · Orden de juego</span></div><section class="panel"><h2>'+(order?'¿Quién juega primero?':'¿Quiénes juegan hoy?')+'</h2><p class="help">'+(order?'Usa las flechas para acomodar los turnos.':'Añade de 2 a 8 jugadores para compartir la partida.')+'</p><form id="setupForm">'+state.players.map((name,i)=>'<div class="person"><span class="number">'+(i+1)+'</span>'+(order?'<span class="name">'+esc(name)+'</span><button type="button" class="icon" data-move="'+i+'" data-dir="-1" '+(i===0?'disabled':'')+' aria-label="Subir a '+esc(name)+'">↑</button><button type="button" class="icon" data-move="'+i+'" data-dir="1" '+(i===state.players.length-1?'disabled':'')+' aria-label="Bajar a '+esc(name)+'">↓</button>':'<input data-name="'+i+'" aria-label="Nombre del jugador '+(i+1)+'" placeholder="Jugador '+(i+1)+'" maxlength="30" required value="'+esc(name)+'"><button type="button" class="icon danger" data-remove="'+i+'" aria-label="Eliminar jugador '+(i+1)+'" '+(state.players.length<=2?'disabled':'')+'>×</button>')+'</div>').join('')+(!order&&state.players.length<8?'<button type="button" id="add" class="quiet" style="width:100%">+ Añadir jugador</button>':'')+'<div class="actions">'+(order?'<button type="button" id="back">Atrás</button>':'')+'<button class="primary">'+(order?'Comenzar partida →':'Elegir orden →')+'</button></div></form></section></div>';return}
const result=state.phase==='result';app.innerHTML='<div class="topline"><div><span class="eyebrow">'+(result?'Cada palabra contó':'Tu mesa de juego')+'</span><h1>'+(result?'La partida, en números.':state.phase==='deduct'?'El último recuento.':'Cada punto cuenta.')+'</h1></div><button id="new" class="quiet">Nueva partida</button></div>';
if(result){const ranks=state.players.map((name,i)=>({name,i,base:total(i),loss:state.deductions[i]||0,net:total(i)-(state.deductions[i]||0)})).sort((a,b)=>b.net-a.net);const winners=ranks.filter(p=>p.net===ranks[0].net);app.innerHTML+='<div class="winner" style="margin-top:26px"><div class="medal" aria-hidden="true">♛</div><span class="eyebrow">'+(winners.length>1?'¡Tenemos un empate!':'¡Tenemos ganador!')+'</span><h1>'+winners.map(p=>esc(p.name)).join(' y ')+'</h1><p>'+ranks[0].net+' puntos finales · '+Math.ceil(state.scores.length/state.players.length)+' rondas jugadas</p></div><div class="grid"><section class="panel"><h2>Clasificación final</h2>'+ranks.map((p,i)=>'<div class="rank"><span class="number">'+(ranks.findIndex(x=>x.net===p.net)+1)+'</span><div class="name">'+esc(p.name)+'<small>'+p.base+' acumulados − '+p.loss+' de descuento</small></div><strong>'+p.net+'</strong></div>').join('')+'<div class="actions"><button id="adjust">Corregir descuentos</button></div></section><section class="panel"><h2>La historia de la partida</h2>'+history()+'</section></div>';return}
app.innerHTML+='<div class="scoreboard">'+state.players.map((n,i)=>'<div class="scorecard '+(state.phase==='play'&&i===current()?'current':'')+'"><div class="player">'+esc(n)+'</div><div class="points">'+total(i)+'<small>pts</small></div>'+(state.phase==='play'&&i===current()?'<small>● Su turno</small>':'<small>Turno '+(i+1)+'</small>')+'</div>').join('')+'</div>';
if(state.phase==='deduct'){app.innerHTML+='<div class="grid"><section class="panel"><span class="eyebrow">Cierre de partida</span><h2 style="margin-top:10px">Puntos que se descuentan</h2><p class="help">Escribe cuánto pierde cada jugador por las fichas restantes. Se restará de su acumulado; deja 0 si no pierde puntos.</p><form id="deductForm">'+state.players.map((n,i)=>'<div class="deduction"><label for="loss'+i+'">'+esc(n)+'<small>'+total(i)+' puntos acumulados</small></label><input id="loss'+i+'" data-loss="'+i+'" aria-label="Puntos a restar a '+esc(n)+'" type="number" inputmode="numeric" min="0" max="9999" step="1" value="'+(state.deductions[i]||0)+'" required></div>').join('')+'<div class="actions"><button type="button" id="resume">Volver al juego</button><button class="primary">Ver ganador →</button></div></form></section><section class="panel"><h2>Jugada a jugada</h2><p class="help">Toca un puntaje si necesitas corregirlo.</p>'+history()+'</section></div>';return}
app.innerHTML+='<div class="grid"><section class="panel turn">'+(state.finalRound?'<span class="pill">Ronda final · '+(state.players.length-current())+' turno(s) por jugar</span>':'<span class="eyebrow" style="color:#d4c397">Ronda '+round()+' · turno '+(current()+1)+' de '+state.players.length+'</span>')+'<h2 style="margin-top:14px">Te toca, '+esc(state.players[current()])+'.</h2><p>Suma una buena jugada al tablero.</p><form id="scoreForm"><label for="points">Puntos de esta jugada</label><div class="entry"><input id="points" type="number" inputmode="numeric" min="0" max="9999" step="1" placeholder="0" required autocomplete="off"><button class="primary">Sumar puntos →</button></div></form><div class="actions"><button id="pass" class="quiet">Pasar · 0 puntos</button><button id="undo" class="quiet" '+(!state.scores.length?'disabled':'')+'>↶ Deshacer</button></div></section><section class="panel"><span class="eyebrow">El cierre, a su ritmo</span><h2 style="margin-top:12px">¿Se acerca el final?</h2><p class="help">Marca la ronda actual como la última. Cuando termine el último jugador del orden, podrás descontar las fichas restantes.</p><div class="actions"><button id="final">'+(state.finalRound?'Cancelar ronda final':'Ronda '+round()+' será la final')+'</button></div><button id="close" class="quiet" style="width:100%;margin-top:10px">Terminar ahora</button></section></div><section class="panel" style="margin-top:22px"><h2>Jugada a jugada</h2><p class="help">Todos los puntos, en orden. Toca uno para corregirlo.</p>'+history()+'</section>';
}
function addScore(value){if(!Number.isInteger(value)||value<0||value>9999)return;state.scores.push(value);if(state.finalRound&&state.scores.length>=state.finalRound*state.players.length)state.phase='deduct';update();notice('Jugada guardada')}
app.addEventListener('input',e=>{if(e.target.matches('[data-name]')){state.players[+e.target.dataset.name]=e.target.value;save()}if(e.target.matches('[data-loss]')&&e.target.validity.valid){state.deductions[+e.target.dataset.loss]=Number(e.target.value);save()}});
app.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='setupForm'){if(state.phase==='names'){const names=state.players.map(n=>n.trim());if(names.some(n=>!n)){notice('Escribe el nombre de cada jugador');return}if(new Set(names.map(n=>n.toLocaleLowerCase())).size!==names.length){notice('Usa nombres diferentes para distinguir a los jugadores');return}state.players=names;state.phase='order'}else state.phase='play';update()}else if(e.target.id==='scoreForm'){addScore(Number(document.getElementById('points').value))}else if(e.target.id==='deductForm'){state.deductions=state.players.map((_,i)=>Number(document.getElementById('loss'+i).value));state.phase='result';update();window.scrollTo({top:0,behavior:'smooth'})}});
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.remove!==undefined){state.players.splice(+b.dataset.remove,1);update();return}if(b.dataset.move!==undefined){const i=+b.dataset.move,j=i+Number(b.dataset.dir);[state.players[i],state.players[j]]=[state.players[j],state.players[i]];update();return}if(b.dataset.edit!==undefined){editIndex=Number(b.dataset.edit);document.getElementById('editName').textContent=state.players[editIndex%state.players.length]+' · Ronda '+(Math.floor(editIndex/state.players.length)+1);document.getElementById('editPoints').value=state.scores[editIndex];document.getElementById('editDialog').showModal();return}switch(b.id){case'add':state.players.push('');update();app.querySelector('[data-name="'+(state.players.length-1)+'"]').focus();break;case'back':state.phase='names';update();break;case'pass':addScore(0);break;case'undo':if(state.scores.length){state.scores.pop();update();notice('Última jugada deshecha')}break;case'final':state.finalRound=state.finalRound?null:round();update();break;case'close':if(confirm('¿Terminar los turnos ahora y pasar a los descuentos finales?')){state.phase='deduct';update()}break;case'resume':state.phase='play';state.finalRound=null;update();break;case'adjust':state.phase='deduct';update();break;case'new':if(confirm('¿Empezar una nueva partida? Se borrarán los puntos de esta partida.')){state=fresh();update()}break}});
document.getElementById('cancelEdit').onclick=()=>document.getElementById('editDialog').close();
document.getElementById('editForm').onsubmit=e=>{e.preventDefault();const value=Number(document.getElementById('editPoints').value);if(Number.isInteger(value)&&value>=0&&value<=9999){state.scores[editIndex]=value;document.getElementById('editDialog').close();update();notice('Puntos corregidos')}};
render();
</script></body></html>
